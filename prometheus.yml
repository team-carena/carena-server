global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'carena'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 'blue:8080'
          - 'green:8080'

  - job_name: 'nginx-exporter'
    static_configs:
      - targets:
          - 'nginx-exporter:9113'
