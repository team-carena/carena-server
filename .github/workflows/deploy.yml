name: Deploy

on:
  push:
    branches:
      - main
      - devlop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 코드 체크아웃
      - uses: actions/checkout@v4

      # 2. JDK 설정
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Gradle 빌드
      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew bootJar -x test

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin


      # 4. Docker 이미지 빌드 & 저장
      - name: Build & Push Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/carena-api:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/carena-api:latest

      # 5. 필요한 파일만 en2로  전송
      - name: Copy config files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml,nginx/"
          target: "~/app"
          overwrite: true

      # 6. EC2에서 Blue-Green 배포 실행
      - name: Blue-Green Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/app
            
            echo "DB_HOST=${{ secrets.DB_HOST }}" >> .env
            echo "DB_NAME=${{ secrets.DB_NAME }}" >> .env
            echo "DB_USERNAME=${{ secrets.DB_USERNAME }}" >> .env
            echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
            
            #  default.conf 초기 생성 (없을 경우만)
            if [ ! -f nginx/conf.d/default.conf ]; then
              echo "초기 설정: default.conf 생성 (Blue로 시작)"
              cat > nginx/conf.d/default.conf << 'EOF'
            upstream app {
              server blue:8080;
            }
            server {
              listen 80;
              location / {
              proxy_pass http://app;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            }
            location /actuator/health {
            proxy_pass http://app/actuator/health;
              }
            }
            EOF
              docker-compose up -d
              exit 0
            fi
            
            #  디스크 정리
            docker image prune -af --filter "until=24h"
            
            docker pull ${{ secrets.DOCKER_USERNAME }}/carena-api:latest

            # 현재 active 판단 (symlink 기준)
            ACTIVE=$(grep "server" nginx/conf.d/default.conf | grep -o "blue\|green" || echo "blue")

            if [ "$ACTIVE" = "blue" ]; then
              NEW="green"
              PORT=8081
            else
              NEW="blue"
              PORT=8082
            fi

            echo "현재 active: $ACTIVE"
            echo "새 배포 대상: $NEW"

            # 새 컨테이너 기동
            docker compose up -d --no-deps $NEW

            # 헬스체크
            HEALTH_OK=false
            for i in {1..20}; do
              if curl -f http://localhost:${PORT}/actuator/health 2>/dev/null; then
                echo "[$i/20] 헬스체크 성공"
                HEALTH_OK=true
                break
                fi
                echo "[$i/20] 헬스체크 대기중..."
                sleep 3
            done
            
            # 헬스체크 실패 시 롤백
            if [ "$HEALTH_OK" = false ]; then
              echo "❌ 헬스체크 실패! 롤백합니다."
              docker-compose stop $NEW
              exit 1
            fi
            
            # nginx 스위치 
            echo "트래픽을 $NEW 환경으로 전환 중..."
            sed -i "s/server $ACTIVE:8080;/server $NEW:8080;/" nginx/conf.d/default.conf
            
            docker exec nginx nginx -s reload
            
            docker system prune -f   

            echo "✅ 배포 완료"